databases:
  - name: kehe-trend-db
    plan: free
    databaseName: kehe_trends
    user: kehe

services:
  - type: web
    name: kehe-trend-tool
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: kehe-trend-db
          property: connectionString
    healthCheckPath: /health
