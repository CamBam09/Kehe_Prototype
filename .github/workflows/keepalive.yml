name: Keep Render service awake

on:
  schedule:
    # Every 10 minutes. Render's free plan spins a web service down after
    # ~15 minutes of no traffic, so this stays comfortably under that.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 20 "https://kehe-trend-tool.onrender.com/health" \
            || echo "Ping failed (service may still be waking up) - not failing the job"
